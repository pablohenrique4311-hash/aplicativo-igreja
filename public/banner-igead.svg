<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcc2cb"/>
      <stop offset="35%" stop-color="#ccd2db"/>
      <stop offset="70%" stop-color="#b0b7c2"/>
      <stop offset="100%" stop-color="#98a0ad"/>
    </linearGradient>

    <!-- Palm leaves shadow filter -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Palm Leaf Shadow Projections (Left and Right) -->
  <!-- Left Palm Leaf Shadows -->
  <g opacity="0.32" filter="url(#softShadow)" fill="#1e293b">
    <path d="M -80 500 Q 120 420 320 460 C 260 410 180 380 90 390 C 200 370 290 390 340 440 C 240 330 140 320 40 340 C 180 310 280 340 330 400 C 200 280 90 270 -20 300 Z" />
    <path d="M -60 700 Q 150 580 340 640 C 270 570 170 540 60 560 C 200 520 280 550 330 600 Z" />
  </g>

  <!-- Right Palm Leaf Shadows (Upper and Lower Right) -->
  <g opacity="0.45" filter="url(#softShadow)" fill="#0f172a">
    <!-- Main Top Right Palm Branch -->
    <path d="M 1340 -60 Q 1020 200 860 380 C 920 300 1020 220 1140 180 C 980 270 910 340 880 420 C 970 320 1080 240 1200 190 C 1040 310 960 400 920 470 C 1020 360 1120 280 1250 220 C 1070 380 990 480 960 560 C 1060 430 1180 330 1310 270 Z" />
    <path d="M 1320 180 Q 1120 360 990 540 C 1050 440 1140 360 1260 310 C 1110 420 1040 500 1010 600 Z" />
  </g>

  <!-- ==================== CENTER OFFICIAL LOGO ==================== -->
  <g transform="translate(370, 260)" fill="#090d16">
    <!-- Emblem Circle (Left) -->
    <g transform="translate(0, 0)">
      <!-- Outer Circle -->
      <circle cx="75" cy="75" r="62" stroke="#090d16" stroke-width="5" fill="none"/>

      <!-- Brazil Map Silhouette -->
      <path d="M 64 28
               C 71 26, 84 29, 92 31
               C 99 33, 106 35, 109 40
               C 114 47, 118 52, 125 57
               C 130 62, 134 67, 131 74
               C 127 81, 126 88, 121 93
               C 116 98, 112 105, 107 114
               C 103 119, 100 123, 96 125
               C 93 123, 89 118, 84 113
               C 79 108, 74 106, 68 101
               C 61 96, 52 89, 47 82
               C 42 75, 40 66, 45 59
               C 50 52, 55 42, 58 35
               Z"
            fill="none" stroke="#090d16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

      <!-- Central Holy Flame -->
      <path d="M 75 114
               C 71 109, 65 98, 65 86
               C 65 74, 72 65, 73 54
               C 73 49, 75 40, 77 35
               C 79 42, 81 49, 81 54
               C 83 58, 86 61, 87 66
               C 90 59, 91 54, 89 47
               C 94 54, 96 63, 96 72
               C 96 84, 91 95, 86 104
               C 82 109, 78 112, 75 114
               Z"
            fill="#090d16"/>

      <!-- Inner Flame Core (Cutout) -->
      <path d="M 75 110
               C 72 106, 69 97, 69 86
               C 69 76, 74 69, 76 60
               C 77 65, 80 72, 81 77
               C 83 81, 85 84, 85 91
               C 85 100, 80 107, 75 110
               Z"
            fill="#c0c6cf"/>

      <!-- Base Curve -->
      <path d="M 40 125 Q 75 134 110 125" fill="none" stroke="#090d16" stroke-width="3" stroke-linecap="round"/>

      <!-- Left Base Laurel Leaves -->
      <path d="M 46 121 C 40 116, 37 107, 40 102 C 44 105, 48 114, 46 121 Z" fill="#090d16"/>
      <path d="M 55 125 C 48 120, 44 112, 46 107 C 51 110, 55 118, 55 125 Z" fill="#090d16"/>
      <path d="M 64 127 C 58 123, 55 116, 58 111 C 62 113, 65 120, 64 127 Z" fill="#090d16"/>

      <!-- Right Base Laurel Leaves -->
      <path d="M 104 121 C 110 116, 113 107, 110 102 C 106 105, 102 114, 104 121 Z" fill="#090d16"/>
      <path d="M 95 125 C 102 120, 106 112, 104 107 C 99 110, 95 118, 95 125 Z" fill="#090d16"/>
      <path d="M 86 127 C 92 123, 95 116, 92 111 C 88 113, 85 120, 86 127 Z" fill="#090d16"/>
    </g>

    <!-- Typography "Geração Eleita" & Slogan -->
    <g transform="translate(160, 12)">
      <!-- Calligraphic Brush Script -->
      <text x="0" y="70"
            font-family="'Caveat', 'Kaushan Script', 'Brush Script MT', cursive, sans-serif"
            font-size="68"
            font-weight="700"
            letter-spacing="1"
            fill="#090d16">
        Geração Eleita
      </text>

      <!-- Slogan -->
      <text x="3" y="108"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
            font-size="20"
            font-weight="800"
            font-style="italic"
            letter-spacing="-0.3"
            fill="#090d16">
        Conectado com o Céu , firme na terra
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM RIGHT SIGNATURE ==================== -->
  <g transform="translate(1080, 520)" fill="#090d16">
    <!-- Heart Outline -->
    <path d="M 50 25
             C 50 11, 38 0, 25 0
             C 15 0, 7 6, 0 16
             C -7 6, -15 0, -25 0
             C -38 0, -50 11, -50 25
             C -50 42, -30 60, 0 84
             C 30 60, 50 42, 50 25
             Z"
          transform="translate(45, 0) scale(0.45)"
          fill="none" stroke="#090d16" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- "Jesus Cristo é o Centro" -->
    <text x="45" y="68"
          text-anchor="middle"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
          font-size="24"
          font-weight="900"
          font-style="italic"
          fill="#090d16">
      Jesus Cristo
    </text>
    <text x="45" y="98"
          text-anchor="middle"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
          font-size="24"
          font-weight="900"
          font-style="italic"
          fill="#090d16">
      é o Centro
    </text>
  </g>
</svg>
